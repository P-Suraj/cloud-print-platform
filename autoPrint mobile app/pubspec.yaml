name: autoprint_share
description: Share files to your print shop directly from WhatsApp or any app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Share intent receiving
  receive_sharing_intent: ^1.8.1

  # Supabase
  supabase_flutter: ^2.5.0

  # QR Scanner
  mobile_scanner: ^5.2.3

  # File handling
  path_provider: ^2.1.3
  mime: ^1.0.5
  flutter_image_compress: ^2.3.0

  # State management
  flutter_riverpod: ^2.5.1

  # Persistence
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # UUID generation
  uuid: ^4.4.0

  # Network detection
  connectivity_plus: ^6.0.5

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
